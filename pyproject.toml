[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "figkit"
version = "0.1.0"
description = "Publication figure toolkit: one swappable Theme, matplotlib panel primitives, R mirror"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["matplotlib>=3.6", "numpy", "pandas"]

[tool.setuptools.packages.find]
include = ["figkit*"]
